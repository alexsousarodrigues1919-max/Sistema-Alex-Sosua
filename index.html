
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema do Escritório | Gestão Corporativa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --primary-blue: #1e40af;
        --secondary-blue: #3b82f6;
        --exec-black: #0f172a;
        --pure-white: #ffffff;
      }
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: #f1f5f9;
        color: var(--exec-black);
        letter-spacing: -0.01em;
      }
      .dark body {
        background-color: #020617;
        color: #f8fafc;
      }
      /* Professional Transitions */
      .page-transition {
        animation: page-enter 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      @keyframes page-enter {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      /* Custom Shadows */
      .exec-shadow {
        box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.04), 0 4px 12px -2px rgba(0, 0, 0, 0.03);
      }
      /* Input Focus Effects */
      input:focus, select:focus, textarea:focus {
        border-color: var(--primary-blue) !important;
        box-shadow: 0 0 0 4px rgba(30, 64, 175, 0.08) !important;
      }
      /* Professional Scrollbar */
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
      .dark ::-webkit-scrollbar-thumb { background: #334155; }
    </style>
